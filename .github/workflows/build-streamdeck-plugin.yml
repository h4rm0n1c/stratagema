name: Build Stream Deck plugin

on:
  pull_request:
  push:
    branches: [streamdeck-plugin]
    tags: ['streamdeck-v*']

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/streamdeck-v')
        shell: pwsh
        run: |
          $version = (Get-Content streamdeck_plugin/manifest.json -Raw | ConvertFrom-Json).Version
          if ($env:GITHUB_REF_NAME -ne "streamdeck-v$version") {
            throw "Release tag must match manifest version: streamdeck-v$version"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: streamdeck_plugin/package-lock.json

      - name: Install dependencies
        working-directory: streamdeck_plugin
        run: npm ci

      - name: Test backend
        working-directory: streamdeck_plugin
        run: npm test

      - name: Install test browser
        working-directory: streamdeck_plugin
        run: npx playwright install chromium

      - name: Test inspector
        working-directory: streamdeck_plugin
        run: npm run test:ui

      - name: Build and package installer
        shell: pwsh
        run: ./streamdeck_plugin/scripts/package.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: stratagema-streamdeck-plugin
          if-no-files-found: error
          path: |
            dist/com.stratagema.sdplugin-*.streamDeckPlugin
            dist/SHA256SUMS.txt

  draft-release:
    needs: build-plugin
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/streamdeck-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download tested installer
        uses: actions/download-artifact@v4
        with:
          name: stratagema-streamdeck-plugin
          path: dist

      - name: Prepare draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.streamDeckPlugin dist/SHA256SUMS.txt \
            --verify-tag --draft --prerelease --latest=false \
            --title "Stratagema Stream Deck ${RELEASE_TAG#streamdeck-v} (preview)" \
            --notes-file docs/streamdeck_release_notes.md
